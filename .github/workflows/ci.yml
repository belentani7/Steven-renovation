name: CI
on: [push, workflow_dispatch, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificación de protocolos
        run: test -f README.md && test -f LICENSE && test -f .gitignore
      - name: HTML parseable
        run: for f in $(find . -name "*.html" | head -50); do python3 -c "import html.parser,sys; html.parser.HTMLParser().feed(open('$f',encoding='utf-8',errors='replace').read())"; done && echo HTML OK
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sintaxis JS propio
        # magic/plugin.js se excluye: es TypeScript (fuente del plugin opencode), no JS ejecutable
        run: find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" -not -path "./magic/plugin.js" | xargs -r -n1 node --check
      - name: Tests básicos
        run: node --test test/
