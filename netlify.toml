# ================================================================
# netlify.toml — Configuración de despliegue
# Steven Rénovation · v5 PREMIUM · by Pedro Belentani
# ================================================================

[build]
  publish = "public"
  functions = "netlify/functions"

# La función "devis" se expone en /.netlify/functions/devis
[functions.devis]
  included_files = []

# Redirect del formulario como respaldo (si el fetch falla por red)
[[redirects]]
  from = "/api/devis"
  to = "/.netlify/functions/devis"
  status = 200

# Redirección de raíz (dominio limpio)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
